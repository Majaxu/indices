name: Debug INDEC xls
on:
  push:
    branches: [debug-indec]
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          curl -sSL -A "Mozilla/5.0" -o debug/sh_ipc_divisiones.xls "https://www.indec.gob.ar/ftp/cuadros/economia/sh_ipc_divisiones.xls"
          ls -la debug
          git config user.name bot; git config user.email bot@x
          git add debug && git commit -m "debug: divisiones" && git push
