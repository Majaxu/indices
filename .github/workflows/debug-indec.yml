name: Debug INDEC xls
on:
  push:
    branches: [debug-indec]
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          curl -sSL -A "Mozilla/5.0" -o debug/nivel4.js "https://www.indec.gob.ar/Scripts/nivel4.js"
          curl -sSL -A "Mozilla/5.0" -o debug/tema.html "https://www.indec.gob.ar/Nivel4/Tema/3/5/31"
          for u in sh_ipc_10_26.xls sh_ipc_10_26.xlsx sh_ipc_11_26.xls sh_ipc_09_26.xlsx; do
            echo "$u $(curl -sSL -A Mozilla/5.0 -o /tmp/f -w '%{http_code} %{content_type} %{size_download}' https://www.indec.gob.ar/ftp/cuadros/economia/$u) $(head -c4 /tmp/f | xxd -p)" >> debug/probe.txt
          done
          git config user.name bot; git config user.email bot@x
          git add debug && git commit -m "debug: nivel4 + probe" && git push
