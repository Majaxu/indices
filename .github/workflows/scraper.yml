name: Scraper ICL + IPC

on:
  schedule:
    # Corre 4 veces por dia en horario argentino (UTC-3)
    # 09:00, 11:00, 13:00, 15:00 AR = 12:00, 14:00, 16:00, 18:00 UTC
    - cron: '0 12,14,16,18 * * 1-5'  # Lunes a Viernes
  workflow_dispatch:  # Permite correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Solo commitea si hay cambios
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "📊 Actualización automática de indices $(date -u +%Y-%m-%d)"
            git push
          fi
